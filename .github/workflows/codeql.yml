name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "22 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      languages: ${{ steps.set.outputs.languages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build language matrix
        id: set
        run: |
          langs=("actions")
          if find . -path ./.git -prune -o -type f -name "*.py" -print | grep -q .; then
            langs+=("python")
          fi
          printf -v joined '"%s",' "${langs[@]}"
          echo "languages=[${joined%,}]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
